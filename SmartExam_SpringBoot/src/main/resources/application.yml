server:
  port: 8080

spring:
  application:
    name: SmartExam
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_exam?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456789zyx

ollama:
  url: http://localhost:11434
  model: gemma3:4b

jwt:
  # 生产环境请通过环境变量覆盖，且不少于32字节
  secret: ${JWT_SECRET:SmartExamSecretKey2026!@#$%%^&*()VeryLongEnough}
  expiration: 86400000 # 24小时

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

upload:
  # 头像存储目录，与 WebConfig 的静态资源映射共用，改这里即可，两处不会脱节
  avatar-path: D:/JavaProjects/Spring/SmartExam/SmartExam_SpringBoot/uploads/avatars